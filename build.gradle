apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
    namespace "com.example.motionstudio"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.motionstudio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.4.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MOTIONSTUDIO_UPLOAD_STORE_FILE')) {
                storeFile file(MOTIONSTUDIO_UPLOAD_STORE_FILE)
                storePassword MOTIONSTUDIO_UPLOAD_STORE_PASSWORD
                keyAlias MOTIONSTUDIO_UPLOAD_KEY_ALIAS
                keyPassword MOTIONSTUDIO_UPLOAD_KEY_PASSWORD
            } else {
                // Fallback to debug keystore for local testing if release keystore is not provided
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
